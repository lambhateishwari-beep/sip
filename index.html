<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Golden Sip Café · Menu &amp; Order</title>
<meta name="description" content="Browse the menu of The Golden Sip Café and send your order on WhatsApp.">
<meta name="theme-color" content="#120d09">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120d09; --bg-hero:#2b2214; --card:#16110c; --card-line:#2c2216;
  --gold:#e8c987; --gold-deep:#c79f58; --cream:#f2e6cc; --muted:#a39176; --line:#3b2e1c;
  --veg:#3fae5a; --nonveg:#d9453b; --wa:#25d366; --badge:#7a352b;
  --bar-h:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--cream);font-family:'Poppins',system-ui,sans-serif;font-size:16px;line-height:1.45;padding-bottom:110px}
button{font-family:inherit;color:inherit;cursor:pointer}
.serif{font-family:'Cinzel',Georgia,serif}

/* hero */
.hero{background:radial-gradient(120% 90% at 50% 0%,#3a2d18 0%,var(--bg-hero) 55%,#241b0f 100%);text-align:center;padding:44px 20px 34px}
.logo{width:156px;height:156px;border-radius:50%;border:3px solid #f6efe0;box-shadow:0 0 0 6px rgba(232,201,135,.18),0 0 46px rgba(232,201,135,.35);display:block;margin:0 auto 26px;background:#0b0705}
.hero h1{margin:0;font-family:'Cinzel',serif;font-weight:700;font-size:clamp(26px,8vw,40px);letter-spacing:.07em;color:var(--gold);text-shadow:0 0 22px rgba(232,201,135,.25);font-variant:small-caps}
.tag{margin:14px 0 0;color:var(--muted);letter-spacing:.38em;font-size:clamp(11px,3.1vw,15px);text-transform:uppercase}

/* sticky bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(18,13,9,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px 12px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;padding:0 16px;background:#171109}
.search span{color:var(--muted);font-size:18px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--cream);font:inherit;font-size:16px;padding:14px 0}
.search input::placeholder{color:#7d6e57}
.search button{background:none;border:0;color:var(--muted);font-size:18px;padding:6px;display:none}
.rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:12px 0 2px;margin:0 -16px;padding-left:16px;padding-right:16px}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#1b140c;color:#e9dcc2;border-radius:999px;padding:9px 18px;font-size:15px;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,#f3dba5,#c99f55);color:#241a0b;border-color:transparent;font-weight:600}
.chip.group.on{background:#1b140c;color:var(--gold);border-color:var(--gold-deep);font-weight:500}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:currentColor;opacity:.8}

/* menu */
main{padding:6px 16px 0;max-width:760px;margin:0 auto;background:linear-gradient(#2a2114 0,#171009 420px)}
section.cat{padding-top:34px;scroll-margin-top:calc(var(--bar-h) + 4px)}
.cat h2{display:flex;align-items:center;gap:18px;margin:0 0 18px;font-family:'Cinzel',serif;font-weight:700;font-size:clamp(28px,8vw,38px);color:var(--gold);font-variant:small-caps;letter-spacing:.06em}
.cat h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-deep),transparent)}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:26px;padding:20px 20px 8px;margin-bottom:20px}
.badge{display:inline-block;background:var(--badge);color:#f3dfc7;font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;padding:9px 16px;border-radius:12px;margin:0 0 6px}
.item{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px dashed #3a2d1c}
.item:last-child{border-bottom:0}
.mark{flex:0 0 22px;width:22px;height:22px;border:2px solid;border-radius:5px;display:grid;place-items:center}
.mark::after{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.mark.veg{color:var(--veg)} .mark.nonveg{color:var(--nonveg)} .mark.none{border:0}
.mark.none::after{display:none}
.info{flex:1;min-width:0}
.name{font-size:clamp(17px,4.6vw,21px);font-weight:500;color:var(--cream);overflow-wrap:anywhere}
.desc{font-size:13px;color:var(--muted);margin-top:2px}
.prices{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.price{display:flex;align-items:center;gap:6px;border:1.5px solid var(--gold-deep);background:#1a130b;color:var(--cream);border-radius:14px;padding:9px 16px;font-size:18px;font-weight:600;min-width:74px;justify-content:center;transition:transform .12s,background .12s}
.price small{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.price:active{transform:scale(.94);background:#2a1f10}
.price.pop{background:linear-gradient(135deg,#f3dba5,#c99f55);color:#241a0b;border-color:transparent}
.price.pop small{color:#4b3714}
.sold{opacity:.5}
.sold .price{pointer-events:none;border-style:dashed;text-decoration:line-through}
.soldtag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--nonveg);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:60px 10px}
.skeleton{height:120px;border-radius:26px;background:linear-gradient(90deg,#171009,#21180d,#171009);background-size:200% 100%;animation:sh 1.4s infinite;margin:30px 0}
@keyframes sh{to{background-position:-200% 0}}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 20px 10px}
footer a{color:var(--gold);text-decoration:none}

/* bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(12,8,5,.96) 28%)}
.dock button{height:62px;border-radius:20px;font-size:clamp(15px,4.7vw,19px);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;padding:0 8px}
.btn-order{flex:1;border:1.5px solid var(--gold-deep);background:#1a130b;color:var(--cream)}
.btn-wa{flex:1.1;border:0;background:var(--wa);color:#fff;box-shadow:0 8px 24px rgba(37,211,102,.25)}
.dock svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2}

/* order sheet */
.back{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.back.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow-y:auto;background:#17110a;border:1px solid var(--gold-deep);border-bottom:0;border-radius:32px 32px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:760px;margin:0 auto}
.sheet.open{transform:none}
.sheet h3{margin:0;font-family:'Cinzel',serif;font-size:32px;color:var(--gold);font-variant:small-caps;letter-spacing:.04em}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.x{background:none;border:0;font-size:34px;line-height:1;padding:4px 8px;color:var(--cream)}
.noitems{text-align:center;color:#d8c9a9;font-size:19px;line-height:1.55;padding:34px 4px 40px}
.line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed #3a2d1c}
.line .ln{flex:1;min-width:0}
.line .ln b{font-weight:500;display:block;overflow-wrap:anywhere}
.line .ln span{color:var(--muted);font-size:13px}
.qty{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:12px}
.qty button{background:none;border:0;width:36px;height:36px;font-size:20px;color:var(--gold)}
.qty i{font-style:normal;min-width:22px;text-align:center;font-weight:600}
.amt{min-width:64px;text-align:right;font-weight:600}
label.f{display:block;margin:20px 0 8px;color:#d8c9a9;font-size:17px}
label.f em{color:#e5493d;font-style:normal}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg button{height:58px;border-radius:18px;border:1.5px solid var(--line);background:#0f0a06;font-size:17px;font-weight:600;color:var(--cream)}
.seg button.on{border-color:var(--gold);background:#2a2010;color:var(--gold)}
.fld{width:100%;border:1.5px solid var(--line);border-radius:18px;background:#0f0a06;color:var(--cream);font:inherit;font-size:17px;padding:17px 18px;outline:0}
.fld:focus{border-color:var(--gold-deep)}
textarea.fld{min-height:92px;resize:vertical}
.total{display:flex;justify-content:space-between;align-items:center;margin:24px 0 16px;font-size:26px;font-weight:600}
.send{width:100%;height:66px;border:0;border-radius:22px;background:var(--wa);color:#fff;font-size:20px;font-weight:600}
.err{color:#ff7b6e;margin-top:12px;font-size:15px;text-align:center;min-height:20px}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);background:#f3dba5;color:#241a0b;padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;z-index:60;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){ .hero{padding:60px 20px 44px} }
</style>
</head>
<body>

<header class="hero">
  <img class="logo" src="/logo.png" alt="The Golden Sip Café logo" width="156" height="156">
  <h1>The Golden Sip Café</h1>
  <p class="tag">Warm Vibes · Better Sips</p>
</header>

<div class="bar" id="bar">
  <label class="search">
    <span>⌕</span>
    <input id="q" type="search" placeholder="Search dishes, drinks…" autocomplete="off" enterkeyhint="search">
    <button id="qx" type="button" aria-label="Clear search">✕</button>
  </label>
  <div class="rail" id="groups"></div>
  <div class="rail" id="cats"></div>
</div>

<main id="menu"><div class="skeleton"></div><div class="skeleton"></div></main>

<footer>Orders are sent to us on WhatsApp · <a href="https://wa.me/917559492970" rel="noopener">+91 75594 92970</a></footer>

<div class="dock">
  <button class="btn-order" id="openCart" type="button">🛒 <span>My Order (<b id="count">0</b>)</span></button>
  <button class="btn-wa" id="openWa" type="button">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
    Order Online
  </button>
</div>

<div class="back" id="back"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head"><h3 id="sheetTitle">Your Order</h3><button class="x" id="closeSheet" type="button" aria-label="Close">✕</button></div>
  <div id="lines"></div>

  <label class="f">Order Type <em>*</em></label>
  <div class="seg" id="otype">
    <button type="button" data-t="Dine In">Dine In</button>
    <button type="button" data-t="Takeaway">Takeaway</button>
    <button type="button" data-t="Delivery">Delivery</button>
  </div>

  <label class="f" for="cname">Your Name <em>*</em></label>
  <input class="fld" id="cname" maxlength="60" placeholder="Enter your name" autocomplete="name">

  <label class="f" for="cwhere" id="wherelabel">Table No. / Delivery Address <em>*</em></label>
  <input class="fld" id="cwhere" maxlength="200" placeholder="Select an order type first" autocomplete="off">

  <label class="f" for="cnote">Note (special instructions, optional)</label>
  <textarea class="fld" id="cnote" maxlength="300" placeholder="e.g. send ketchup, less spicy"></textarea>

  <div class="total"><span>Total</span><span id="total">₹0</span></div>
  <button class="send" id="send" type="button">Send Order on WhatsApp</button>
  <div class="err" id="err" role="alert"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var WHATSAPP = '917559492970';          // orders are sent to this WhatsApp number
var CAFE = 'The Golden Sip Café';

var $ = function(id){ return document.getElementById(id); };
var state = { cats: [], allCats: [], group: 'all', q: '', cart: [], type: '' };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function rupee(n){ return '₹' + Number(n).toLocaleString('en-IN'); }
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){} return null; }

/* ---------- data ---------- */
function load(){
  return fetch('/api/menu', {cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .catch(function(){ return fetch('/default-menu.json').then(function(r){ return r.json(); }); })
    .then(function(m){ state.cats = (m.categories || []).filter(function(c){ return !c.hidden && c.items && c.items.length; }); })
    .catch(function(){ $('menu').innerHTML = '<div class="empty">Could not load the menu. Please refresh.</div>'; });
}

/* ---------- filtering ---------- */
function visibleCats(){
  var q = state.q.trim().toLowerCase(), g = state.group, out = [];
  state.cats.forEach(function(c){
    if (g === 'bev' && c.group !== 'bev') return;
    var items = c.items.filter(function(it){
      if (g === 'veg' && it.type !== 'veg') return false;
      if (g === 'nonveg' && it.type !== 'nonveg') return false;
      if (q) { var hay = (it.name + ' ' + (it.desc||'') + ' ' + (it.section||'') + ' ' + c.name).toLowerCase();
               return q.split(/\s+/).every(function(w){ return hay.indexOf(w) > -1; }); }
      return true;
    });
    if (items.length) out.push({ id:c.id, name:c.name, items:items });
  });
  return out;
}

/* ---------- render ---------- */
function renderMenu(){
  var cats = visibleCats();
  var html = '';
  cats.forEach(function(c){
    var groups = [], idx = {};
    c.items.forEach(function(it){
      var s = it.section || '';
      if (!(s in idx)) { idx[s] = groups.length; groups.push({ title:s, items:[] }); }
      groups[idx[s]].items.push(it);
    });
    html += '<section class="cat" id="cat-' + esc(c.id) + '" data-id="' + esc(c.id) + '"><h2>' + esc(c.name) + '</h2>';
    groups.forEach(function(g){
      html += '<div class="card">' + (g.title ? '<span class="badge">' + esc(g.title) + '</span>' : '');
      g.items.forEach(function(it){
        var sold = it.available === false;
        html += '<div class="item' + (sold ? ' sold' : '') + '">' +
          '<span class="mark ' + (it.type || 'none') + '"></span>' +
          '<div class="info"><div class="name">' + esc(it.name) + '</div>' +
          (it.desc ? '<div class="desc">' + esc(it.desc) + '</div>' : '') +
          (sold ? '<div class="soldtag">Sold out</div>' : '') + '</div>' +
          '<div class="prices">' + it.prices.map(function(p, i){
            return '<button type="button" class="price" data-id="' + esc(it.id) + '" data-v="' + i + '" aria-label="Add ' + esc(it.name) + (p.label ? ' ' + esc(p.label) : '') + ' to order">' +
              (p.label ? '<small>' + esc(p.label) + '</small>' : '') + rupee(p.price) + '</button>';
          }).join('') + '</div></div>';
      });
      html += '</div>';
    });
    html += '</section>';
  });
  $('menu').innerHTML = html || '<div class="empty">Nothing found. Try another search or filter.</div>';
  renderChips(cats);
  spy();
}

function renderChips(cats){
  var g = [['all','All',''],['veg','Veg','veg'],['nonveg','Non-Veg','nonveg'],['bev','Beverages &amp; Desserts','']];
  $('groups').innerHTML = g.map(function(x){
    return '<button type="button" class="chip group' + (state.group === x[0] ? ' on' : '') + '" data-g="' + x[0] + '">' +
      (x[2] ? '<span class="dot" style="color:' + (x[2]==='veg' ? 'var(--veg)' : 'var(--nonveg)') + '"></span>' : '') + x[1] + '</button>';
  }).join('');
  $('cats').innerHTML = cats.map(function(c){
    return '<button type="button" class="chip" data-c="' + esc(c.id) + '">' + esc(c.name) + '</button>';
  }).join('');
}

/* ---------- scroll spy ---------- */
var spyLock = false;
function spy(){
  if (spyLock) return;
  var secs = document.querySelectorAll('section.cat'), cur = null, line = (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--bar-h')) || 0) + 40;
  secs.forEach(function(s){ if (s.getBoundingClientRect().top <= line) cur = s.getAttribute('data-id'); });
  if (!cur && secs[0]) cur = secs[0].getAttribute('data-id');
  var chips = $('cats').children;
  for (var i = 0; i < chips.length; i++) chips[i].classList.toggle('on', chips[i].getAttribute('data-c') === cur);
}
var lastCur = '';
window.addEventListener('scroll', function(){
  var before = lastCur; spy();
  var a = $('cats').querySelector('.chip.on'); lastCur = a ? a.getAttribute('data-c') : '';
  if (lastCur !== before && a) {
    var r = $('cats'); r.scrollTo({ left: a.offsetLeft - r.clientWidth / 2 + a.offsetWidth / 2, behavior: 'smooth' });
  }
}, { passive: true });

function sizeBar(){ document.documentElement.style.setProperty('--bar-h', $('bar').offsetHeight + 'px'); }
window.addEventListener('resize', sizeBar);

/* ---------- events: filters ---------- */
$('groups').addEventListener('click', function(e){
  var b = e.target.closest('[data-g]'); if (!b) return;
  state.group = b.getAttribute('data-g'); renderMenu(); sizeBar();
  window.scrollTo({ top: Math.max(0, $('menu').offsetTop - $('bar').offsetHeight), behavior: 'smooth' });
});
$('cats').addEventListener('click', function(e){
  var b = e.target.closest('[data-c]'); if (!b) return;
  var s = $('cat-' + b.getAttribute('data-c')); if (!s) return;
  spyLock = true;
  Array.prototype.forEach.call($('cats').children, function(c){ c.classList.toggle('on', c === b); });
  s.scrollIntoView({ behavior: 'smooth', block: 'start' });
  setTimeout(function(){ spyLock = false; spy(); }, 700);
});
var qt;
$('q').addEventListener('input', function(){
  state.q = this.value; $('qx').style.display = this.value ? 'block' : 'none';
  clearTimeout(qt); qt = setTimeout(function(){ renderMenu(); sizeBar(); }, 120);
});
$('qx').addEventListener('click', function(){ $('q').value = ''; state.q = ''; this.style.display = 'none'; renderMenu(); sizeBar(); });

/* ---------- cart ---------- */
function findItem(id){
  for (var i = 0; i < state.allCats.length; i++){
    var its = state.allCats[i].items;
    for (var j = 0; j < its.length; j++) if (its[j].id === id) return its[j];
  }
  return null;
}
function saveCart(){ store('tgs_cart', JSON.stringify(state.cart)); }
function cartLines(){
  var out = [];
  state.cart.forEach(function(l){
    var it = findItem(l.id); if (!it || it.available === false) return;
    var p = it.prices[l.v]; if (!p) return;
    out.push({ key:l.id + ':' + l.v, id:l.id, v:l.v, qty:l.q, name:it.name, label:p.label, price:p.price });
  });
  return out;
}
function updateCount(){
  var n = 0; cartLines().forEach(function(l){ n += l.qty; });
  $('count').textContent = n;
}
function addToCart(id, v){
  var hit = state.cart.filter(function(l){ return l.id === id && l.v === v; })[0];
  if (hit) hit.q += 1; else state.cart.push({ id:id, v:v, q:1 });
  saveCart(); updateCount();
}
$('menu').addEventListener('click', function(e){
  var b = e.target.closest('.price'); if (!b) return;
  addToCart(b.getAttribute('data-id'), parseInt(b.getAttribute('data-v'), 10));
  b.classList.add('pop'); setTimeout(function(){ b.classList.remove('pop'); }, 350);
  var it = findItem(b.getAttribute('data-id'));
  toast('Added · ' + (it ? it.name : ''));
});
var tt;
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('show'); }, 1100);
}

/* ---------- order sheet ---------- */
function openSheet(){ drawLines(); $('back').classList.add('open'); $('sheet').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeSheet(){ $('back').classList.remove('open'); $('sheet').classList.remove('open'); document.body.style.overflow = ''; }
$('openCart').addEventListener('click', openSheet);
$('openWa').addEventListener('click', openSheet);
$('closeSheet').addEventListener('click', closeSheet);
$('back').addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });

function drawLines(){
  var ls = cartLines(), total = 0;
  if (!ls.length){
    $('lines').innerHTML = '<div class="noitems">No items yet. Tap a price to add it,<br>or just send us a message with your order.</div>';
  } else {
    $('lines').innerHTML = ls.map(function(l){
      total += l.price * l.qty;
      return '<div class="line"><div class="ln"><b>' + esc(l.name) + '</b><span>' + (l.label ? esc(l.label) + ' · ' : '') + rupee(l.price) + '</span></div>' +
        '<div class="qty"><button type="button" data-d="-1" data-k="' + esc(l.key) + '" aria-label="Less">−</button><i>' + l.qty + '</i><button type="button" data-d="1" data-k="' + esc(l.key) + '" aria-label="More">+</button></div>' +
        '<div class="amt">' + rupee(l.price * l.qty) + '</div></div>';
    }).join('');
  }
  $('total').textContent = rupee(total);
  updateCount();
}
$('lines').addEventListener('click', function(e){
  var b = e.target.closest('[data-k]'); if (!b) return;
  var parts = b.getAttribute('data-k').split(':'), d = parseInt(b.getAttribute('data-d'), 10);
  state.cart.forEach(function(l){ if (l.id === parts[0] && String(l.v) === parts[1]) l.q += d; });
  state.cart = state.cart.filter(function(l){ return l.q > 0; });
  saveCart(); drawLines();
});

$('otype').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  state.type = b.getAttribute('data-t');
  Array.prototype.forEach.call($('otype').children, function(x){ x.classList.toggle('on', x === b); });
  var ph = { 'Dine In':['Table No.','e.g. Table 5'], 'Takeaway':['Phone Number','Your phone number for pickup'], 'Delivery':['Delivery Address','House no., street, landmark, phone'] }[state.type];
  $('wherelabel').innerHTML = ph[0] + ' <em>*</em>'; $('cwhere').placeholder = ph[1];
  store('tgs_type', state.type);
});

$('send').addEventListener('click', function(){
  var ls = cartLines(), name = $('cname').value.trim(), where = $('cwhere').value.trim(), note = $('cnote').value.trim();
  var err = '';
  if (!ls.length && !note) err = 'Add items from the menu, or write your order in the note.';
  else if (!state.type) err = 'Please choose Dine In, Takeaway or Delivery.';
  else if (!name) err = 'Please enter your name.';
  else if (!where) err = state.type === 'Dine In' ? 'Please enter your table number.' : state.type === 'Takeaway' ? 'Please enter your phone number.' : 'Please enter your delivery address.';
  $('err').textContent = err;
  if (err) return;

  var total = 0;
  var lines = ls.map(function(l, i){
    total += l.price * l.qty;
    return (i + 1) + '. ' + l.name + (l.label ? ' (' + l.label + ')' : '') + ' x' + l.qty + ' = ' + rupee(l.price * l.qty);
  });
  var whereLabel = state.type === 'Dine In' ? 'Table' : state.type === 'Takeaway' ? 'Phone' : 'Address';
  var msg = '*New Order - ' + CAFE + '*\n' +
    'Order Type: ' + state.type + '\n' +
    'Name: ' + name + '\n' +
    whereLabel + ': ' + where + '\n' +
    (lines.length ? '\n*Items*\n' + lines.join('\n') + '\n\n*Total: ' + rupee(total) + '*\n' : '\n') +
    (note ? '\nNote: ' + note : '');
  store('tgs_name', name);
  window.open('https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg), '_blank', 'noopener');
});

/* ---------- start ---------- */
(function init(){
  try { var c = JSON.parse(store('tgs_cart') || '[]'); if (Array.isArray(c)) state.cart = c.filter(function(l){ return l && typeof l.id === 'string' && l.q > 0; }); } catch(e){}
  var n = store('tgs_name'); if (n) $('cname').value = n;
  load().then(function(){
    state.allCats = state.cats; // used to look up cart items
    renderMenu(); sizeBar(); updateCount();
  });
})();
})();
</script>
</body>
</html>
